<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Simple System Architecture of MedBuddy</title>
  <desc id="desc">Three simple layers: the React chat interface, the FastAPI and LangGraph application, and SQLite plus curated CSV datasets.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7,4 L0,7 Z" fill="#526579"/>
    </marker>
    <marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,1 L1,4 L8,7 Z" fill="#526579"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #18324b; }
      .title { font-size: 27px; font-weight: 700; }
      .layer { font-size: 14px; font-weight: 700; letter-spacing: 1.2px; }
      .main { font-size: 20px; font-weight: 700; }
      .detail { font-size: 14px; }
      .panel { stroke-width: 2; rx: 16; }
      .both { stroke: #526579; stroke-width: 1.8; fill: none; marker-start: url(#arrowStart); marker-end: url(#arrow); }
      .link { font-size: 12px; fill: #526579; }
    </style>
  </defs>
  <rect width="900" height="620" rx="18" fill="#ffffff"/>
  <text x="450" y="52" text-anchor="middle" class="title">System Architecture of MedBuddy</text>

  <rect x="95" y="92" width="710" height="112" class="panel" fill="#f1f8f2" stroke="#78a982"/>
  <text x="125" y="121" class="layer">USER LAYER</text>
  <text x="450" y="151" text-anchor="middle" class="main">React Chat Interface</text>
  <text x="450" y="178" text-anchor="middle" class="detail">Login · Messages · Prescription uploads</text>

  <path d="M450 207 V267" class="both"/>
  <text x="475" y="243" class="link">requests and replies</text>

  <rect x="95" y="275" width="710" height="132" class="panel" fill="#f2f6fb" stroke="#7896b3"/>
  <text x="125" y="305" class="layer">APPLICATION LAYER</text>
  <text x="450" y="342" text-anchor="middle" class="main">FastAPI Backend + LangGraph Agent</text>
  <text x="450" y="372" text-anchor="middle" class="detail">Extract · Normalize · Check interactions · Generate replies · Reminders</text>

  <path d="M450 410 V470" class="both"/>
  <text x="475" y="446" class="link">records and reference data</text>

  <rect x="95" y="478" width="710" height="112" class="panel" fill="#fbf7ef" stroke="#c49a58"/>
  <text x="125" y="507" class="layer">DATA LAYER</text>
  <text x="450" y="538" text-anchor="middle" class="main">SQLite Database + Curated CSV Datasets</text>
  <text x="450" y="565" text-anchor="middle" class="detail">Patient records · Brand/generic mappings · Drug interactions</text>
</svg>
