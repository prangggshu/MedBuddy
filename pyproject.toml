[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medbuddy"
version = "0.1.0"
description = "Web-chat medication adherence & drug-interaction assistant (proof-of-concept)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["medbuddy*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
